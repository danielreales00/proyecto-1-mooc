# Análisis de calidad con SonarQube (ADR-0018).
#
# El alcance es el repositorio entero: API y workers en Go, la interfaz web, los
# scripts, la infraestructura y los guiones de carga. Lo único excluido es código
# que no escribimos, y cada exclusión dice por qué. Recortar el alcance para que
# los indicadores salgan mejor está prohibido.
#
# Se ejecuta igual en local (`make calidad`) y en el CI (job «Calidad»): misma
# imagen de SonarQube, mismo scanner, mismas propiedades.

sonar.projectKey=mooc
sonar.projectName=Plataforma MOOC
sonar.sourceEncoding=UTF-8
# La imagen de herramientas trae Python 3.12 (Alpine 3.22).
sonar.python.version=3.12

sonar.sources=backend,frontend,scripts,deploy,infra,capacity-planning,docker-compose.yml,Makefile
sonar.tests=backend,frontend/tests

# Pruebas: los _test.go y el directorio de pruebas de la interfaz cuentan como
# código de prueba, no de producción.
sonar.test.inclusions=backend/**/*_test.go,frontend/tests/**
sonar.exclusions=\
  backend/**/*_test.go,\
  frontend/tests/**,\
  frontend/vendor/**,\
  **/node_modules/**,\
  capacity-planning/resultados/**,\
  capacity-planning/graficas/**

# Por qué se excluye cada cosa:
# - frontend/vendor: hls.js y js-sha256 minificados, de terceros, con su
#   licencia al lado. Analizarlos mediría código ajeno.
# - node_modules: dependencias de desarrollo de la interfaz (prettier,
#   playwright), si alguien las instaló en local.
# - capacity-planning/resultados y graficas: salidas de k6 y PNG, no código.

# Reglas desactivadas. Solo falsos positivos sistemáticos, nunca para mejorar
# un indicador.
# - go:S1135 busca la palabra TODO sin distinguir mayúsculas, y los comentarios
#   están en español: marcaba 16 frases como «todo el trabajo va por esta
#   conexión». En el código no hay ningún TODO, FIXME ni HACK real.
#
# Hallazgos revisados y aceptados como decisión de diseño. Cada uno en un solo
# archivo, nunca la regla en todo el proyecto, y registrado en
# docs/entrega3/deuda-tecnica.md (DT-20).
# - terraform:S6329 en el generador de carga: tiene IP externa propia porque
#   por Cloud NAT perdió 813 conexiones (64 puertos por VM y destino). Existe
#   solo mientras se mide y ninguna regla de firewall deja entrar salvo SSH
#   por IAP (infra/modules/generador/main.tf).
# - terraform:S6404 en el bucket de insignias: la verificación de una
#   insignia es pública. Se concede legacyObjectReader, que lee un objeto por
#   su nombre y no permite listar el bucket (infra/modules/gcs/main.tf).
sonar.issue.ignore.multicriteria=todo,generador,insignias
sonar.issue.ignore.multicriteria.todo.ruleKey=go:S1135
sonar.issue.ignore.multicriteria.todo.resourceKey=**/*
sonar.issue.ignore.multicriteria.generador.ruleKey=terraform:S6329
sonar.issue.ignore.multicriteria.generador.resourceKey=infra/modules/generador/main.tf
sonar.issue.ignore.multicriteria.insignias.ruleKey=terraform:S6404
sonar.issue.ignore.multicriteria.insignias.resourceKey=infra/modules/gcs/main.tf

# Cobertura. Las genera el mismo job antes de analizar: `go test
# -coverprofile` para Go y el reporte lcov de `node --test` para el cliente
# HTTP de la interfaz.
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/lcov.info
