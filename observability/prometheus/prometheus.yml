global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # Docker resuelve el nombre del servicio a todas sus instancias, así que
  # escalar la API no exige tocar esta configuración.
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8080
    metrics_path: /metrics

  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 8081
    metrics_path: /metrics
