# Todo el sistema corre en contenedores, también en desarrollo (enunciado §7 y
# aclaración del profesor). La API y el worker escalan con --scale.

name: mooc

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly: perder Redis no debe perder trabajos encolados (ADR-0004).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # quay.io, no Docker Hub: MinIO retiró de allí sus imágenes y el `docker
    # pull` falla con "repository does not exist". Etiqueta fija a propósito,
    # para que un clon nuevo levante lo mismo que este.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Crea los buckets del ADR-0005 y deja mooc-badges con lectura pública: la URL
  # de verificación de una insignia es pública (CA-07).
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/mooc-originals local/mooc-derived local/mooc-badges local/mooc-quarantine &&
      mc anonymous set download local/mooc-badges &&
      echo 'buckets listos'
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
      - "${MAILPIT_UI_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Job de arranque: aplica migraciones y termina. La API y el worker esperan a
  # que complete con éxito (ADR-0003).
  migrate:
    build:
      context: ./backend
      target: migrate
    image: mooc-migrate
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Los scripts de scripts/ y la colección de Postman corren aquí dentro, no en
  # la máquina de quien los lanza: así no importa si es Linux, macOS o Windows
  # (ADR-0003, «todo corre en contenedores»). El Makefile la invoca por debajo;
  # `make demo`, `make smoke` y compañía se escriben y se ven igual que siempre.
  herramientas:
    build: ./scripts
    image: mooc-herramientas
    profiles: ["tools"]
    env_file: [.env]
    environment:
      # Lo mismo que se escribiría en la máquina: entrada.sh hace que aquí
      # dentro `localhost` lleve a donde debe.
      API: http://localhost:${API_PORT:-8090}
      MAILPIT: http://localhost:${MAILPIT_UI_PORT:-8026}
    volumes:
      - .:/repo
      # `docker compose exec postgres psql` y `docker compose ps` desde dentro:
      # el contenedor habla con el mismo demonio que lo arrancó.
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /repo
    restart: "no"

  # Bajo perfil: se ejecuta a mano con `make seed`, no al levantar el stack.
  seed:
    build:
      context: ./backend
      target: seed
    image: mooc-seed
    profiles: ["tools"]
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: ./backend
      target: api
    image: mooc-api
    env_file: [.env]
    # Sin puerto publicado a propósito: el proxy es la única entrada, y así
    # `docker compose up --scale api=3` no colisiona (CE-01).
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Swagger UI: la documentación navegable del contrato.
  #
  # Va DETRÁS del mismo proxy, en /docs, para que comparta origen con la API.
  # Servirlo en otro puerto obligaría a abrir CORS en todos los endpoints solo
  # para que funcionara el botón «Try it out».
  swagger:
    image: swaggerapi/swagger-ui:latest
    environment:
      SWAGGER_JSON_URL: /openapi.yaml
      BASE_URL: /docs
      # El botón «Authorize» guarda el token entre peticiones.
      PERSIST_AUTHORIZATION: "true"
      DISPLAY_REQUEST_DURATION: "true"
      DOC_EXPANSION: none
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${API_PORT:-8090}:8080"
    depends_on:
      api:
        condition: service_healthy
      swagger:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: worker
    image: mooc-worker
    env_file: [.env]
    environment:
      WORKER_QUEUES: critical=6,default=3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Worker de medios: el mismo binario, con FFmpeg, consumiendo solo la cola
  # `bulk`. La transcodificación satura CPU y tarda minutos; separarla evita que
  # un vídeo largo retrase un correo de verificación (ADR-0004, ADR-0011).
  #
  # La concurrencia es 2 a propósito: más procesos de FFmpeg en paralelo no
  # transcodifican más rápido, solo se estorban en la CPU.
  worker-media:
    build:
      context: ./backend
      target: worker-media
    image: mooc-worker-media
    env_file: [.env]
    environment:
      WORKER_QUEUES: bulk=1
      WORKER_CONCURRENCY: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Perfil `observability`: no se levantan con `make up` a secas, para que el
  # arranque del día a día sea rápido. `make obs` los añade.
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  grafana-data:
