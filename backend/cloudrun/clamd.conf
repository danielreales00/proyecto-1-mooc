# clamd dentro del contenedor de workers de Cloud Run (ADR-0020, D4). Los mismos
# límites que deploy/clamd.conf. Solo escucha en el 127.0.0.1 del contenedor:
# el worker es su único cliente. Sin archivo de registro: en Cloud Run solo
# persiste lo que sale por la consola, y clamd escribe ahí sus errores.
TCPSocket 3310
TCPAddr 127.0.0.1
LogTime yes
User clamav
StreamMaxLength 512M
MaxFileSize 512M
MaxScanSize 512M
