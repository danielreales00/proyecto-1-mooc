# Contrato de la API (RT-05). Es entregable del proyecto (enunciado §8).
#
# Cubre las 88 operaciones del inventario de arquitectura/disenos/api-v1.md.
# Las que aún no responden llevan `x-estado: planificado`; su contrato ya está
# acordado y no debe cambiar al implementarlas.
#
# Se valida en CI con redocly. La API lo sirve en GET /openapi.yaml.

openapi: 3.1.0

info:
  title: Plataforma MOOC — API
  version: 0.2.0
  description: |
    Plataforma web de cursos masivos abiertos en línea.

    ## Convenciones transversales

    - **Autenticación.** Token opaco en `Authorization: Bearer <token>`. La
      sesión se resuelve contra Redis en cada petición, así que revocarla surte
      efecto de inmediato (ADR-0006).
    - **Errores.** Siempre `application/problem+json` (RFC 9457), con
      `trace_id` para correlacionar con logs y trazas, y un arreglo `errors`
      que lista **todos** los incumplimientos, no el primero (ADR-0009).
    - **Idempotencia.** Los endpoints marcados exigen `Idempotency-Key`.
      Repetir la petición con la misma clave y el mismo cuerpo devuelve la
      respuesta guardada con `Idempotency-Replayed: true`; con cuerpo distinto,
      `422` (ADR-0008).
    - **Concurrencia.** Los recursos editables devuelven `ETag`, y su `PATCH`
      exige `If-Match`. Si no coincide, `412` con el estado del servidor.
    - **Paginación.** Siempre por cursor opaco, nunca por desplazamiento.
    - **Límites de tasa.** Los endpoints sensibles responden `429` con
      `Retry-After`, y todos llevan las cabeceras `RateLimit-*`. El login se
      limita por cuenta y por IP a la vez.
    - **Acciones.** Van como segmento final de la ruta
      (`POST .../versions/1/publish`), no con dos puntos. El `ServeMux` de la
      stdlib exige que un comodín ocupe el segmento entero, y elegimos la
      stdlib en el ADR-0002.
    - **Binarios.** No pasan por la API: se suben y descargan con credenciales
      firmadas contra el almacenamiento de objetos (ADR-0005).

    ## Invariantes que este contrato hace cumplir

    1. Una versión de curso publicada es **inmutable** (ADR-0007).
    2. El progreso se ancla a `stable_id`, no al `id` de fila, para sobrevivir
       a una versión nueva (ADR-0007).
    3. **La clave correcta de un quiz nunca sale del servidor** por las rutas
       del estudiante (ADR-0013).
    4. El porcentaje de progreso **lo calcula el servidor**; uno enviado por el
       cliente se rechaza con `422` y se audita (ADR-0012).
    5. La insignia se emite **una sola vez** por inscripción, y su URL pública
       no expone el correo (ADR-0008, CA-07).
  license:
    name: Uso académico

servers:
  - url: http://localhost:8090
    description: Desarrollo local (Docker Compose)

tags:
  - name: operación
    description: Salud y contrato del servicio
  - name: identidad
    description: Registro, verificación, sesiones y contraseñas (RF-01)
  - name: administración
    description: Usuarios, roles, sesiones, auditoría y cola (RF-02)
  - name: autoría
    description: Cursos, versiones, jerarquía y publicación (RF-03, RF-04)
  - name: medios
    description: Carga, procesamiento y entrega de binarios (RF-05, RF-06, RF-07)
  - name: catálogo
    description: Búsqueda pública de cursos (RF-10)
  - name: inscripción
    description: Inscripción, retiro y consumo de contenido (RF-10)
  - name: evaluación
    description: Quizzes e intentos (RF-08)
  - name: progreso
    description: Evidencias, cálculo y aprobación (RF-09)
  - name: insignias
    description: Emisión y verificación pública (RF-09)

security:
  - sesion: []

paths:
  # ==========================================================================
  # Operación
  # ==========================================================================
  /openapi.yaml:
    get:
      tags: [operación]
      operationId: getOpenApiSpec
      summary: El contrato de esta API
      description: |
        La API sirve su propio contrato, empotrado en el binario. Si el archivo
        no está en el árbol de fuentes, no compila: así el contrato no se queda
        atrás del código.
      security: []
      responses:
        "200":
          description: Documento OpenAPI 3.1
          content:
            application/yaml:
              schema: { type: string }

  /healthz:
    get:
      tags: [operación]
      operationId: healthCheck
      summary: Vivacidad del proceso
      security: []
      responses:
        "200":
          description: El proceso responde
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /readyz:
    get:
      tags: [operación]
      operationId: readinessCheck
      summary: Preparación para recibir tráfico
      description: |
        Comprueba PostgreSQL, Redis y el almacén de objetos. Docker Compose lo
        usa para el orden de arranque; en GCP lo usará Cloud Run.
      security: []
      responses:
        "200":
          description: Todas las dependencias responden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Alguna dependencia no responde
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }

  /metrics:
    get:
      tags: [operación]
      operationId: getMetrics
      x-estado: planificado
      summary: Métricas en formato Prometheus
      description: |
        Expuesto solo a la red interna. Incluye `jobs_dead_letter_total`, que
        es lo que dispara la alerta que exige el enunciado §6.
      security: []
      responses:
        "200":
          description: Métricas
          content:
            text/plain:
              schema: { type: string }

  # ==========================================================================
  # Identidad (RF-01)
  # ==========================================================================
  /api/v1/auth/register:
    post:
      tags: [identidad]
      operationId: registerStudent
      summary: Registro público de estudiante
      description: |
        Solo crea estudiantes: los profesores se crean por administración.

        Responde `202` sin esperar al worker que envía el correo. El trabajo se
        registra en PostgreSQL dentro de la misma transacción que el usuario y
        se publica en la cola después del commit, de modo que un fallo de Redis
        no pierde el correo (ADR-0004).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202":
          description: Cuenta creada, pendiente de verificación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/Validacion" }
        "429": { $ref: "#/components/responses/DemasiadasSolicitudes" }

  /api/v1/auth/verify-email:
    post:
      tags: [identidad]
      operationId: verifyEmail
      summary: Verificar el correo con el token recibido
      description: El token es de un solo uso y expira a las 24 horas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 1 }
      responses:
        "200":
          description: Correo verificado
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean, const: true }
                  detail: { type: string }
        "422": { $ref: "#/components/responses/Validacion" }

  /api/v1/auth/resend-verification:
    post:
      tags: [identidad]
      operationId: resendVerification
      x-estado: planificado
      summary: Reenviar el correo de verificación
      description: |
        Responde `202` exista o no la cuenta, para no revelar qué correos están
        registrados. Limitado por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: "Si la cuenta existe y no está verificada, se encoló el correo" }
        "429": { $ref: "#/components/responses/DemasiadasSolicitudes" }

  /api/v1/auth/login:
    post:
      tags: [identidad]
      operationId: login
      summary: Iniciar sesión
      description: |
        Devuelve un token opaco de sesión.

        El mismo `401` y el mismo mensaje para usuario inexistente, contraseña
        incorrecta, cuenta sin verificar y cuenta suspendida: no se revela qué
        correos existen ni en qué estado están.

        **Límite de tasa en dos niveles:** 5 por minuto y **cuenta**, y 60 por
        minuto e IP. Limitar solo por IP castigaría a quienes comparten salida
        a internet; limitar solo por cuenta dejaría rociar contraseñas contra
        muchas cuentas desde una máquina. Las respuestas llevan
        `RateLimit-Limit`, `RateLimit-Remaining` y `RateLimit-Reset`, y el 429
        añade `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Sesión abierta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "422": { $ref: "#/components/responses/Validacion" }
        "429": { $ref: "#/components/responses/DemasiadasSolicitudes" }

  /api/v1/auth/logout:
    post:
      tags: [identidad]
      operationId: logout
      summary: Cerrar la sesión actual
      description: |
        Borra la sesión de Redis. La petición siguiente con ese token responde
        `401`, sin ventana de gracia.
      responses:
        "204": { description: Sesión revocada }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /api/v1/auth/password/forgot:
    post:
      tags: [identidad]
      operationId: forgotPassword
      x-estado: planificado
      summary: Solicitar el restablecimiento de la contraseña
      description: |
        Responde `202` **siempre**, exista o no el correo. Limitado a 3 por
        hora y por correo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: "Si la cuenta existe, se encoló el correo" }
        "429": { $ref: "#/components/responses/DemasiadasSolicitudes" }

  /api/v1/auth/password/reset:
    post:
      tags: [identidad]
      operationId: resetPassword
      x-estado: planificado
      summary: Restablecer la contraseña con el token recibido
      description: |
        Consume el token y **revoca todas las sesiones del usuario**: si alguien
        había entrado con la contraseña anterior, pierde el acceso.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, minLength: 1 }
                password: { type: string, format: password, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: Contraseña cambiada y sesiones revocadas }
        "422": { $ref: "#/components/responses/Validacion" }

  /api/v1/me:
    get:
      tags: [identidad]
      operationId: getCurrentUser
      summary: Perfil de la sesión actual
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    patch:
      tags: [identidad]
      operationId: updateCurrentUser
      x-estado: planificado
      summary: Actualizar el perfil propio
      description: En la Entrega 1 solo el nombre; el correo no cambia.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "412": { $ref: "#/components/responses/PrecondicionFallida" }
        "422": { $ref: "#/components/responses/Validacion" }

  /api/v1/me/password:
    post:
      tags: [identidad]
      operationId: changeOwnPassword
      x-estado: planificado
      summary: Cambiar la contraseña propia
      description: |
        Exige la contraseña actual. Revoca las demás sesiones del usuario y
        conserva la que hace la petición.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 10, maxLength: 128 }
      responses:
        "204": { description: Contraseña cambiada }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "422": { $ref: "#/components/responses/Validacion" }

  /api/v1/me/sessions:
    get:
      tags: [identidad]
      operationId: listOwnSessions
      x-estado: planificado
      summary: Sesiones propias abiertas
      responses:
        "200":
          description: Sesiones
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /api/v1/me/sessions/{sessionId}:
    delete:
      tags: [identidad]
      operationId: revokeOwnSession
      x-estado: planificado
      summary: Revocar una sesión propia
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: "Sesión revocada, con efecto inmediato" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  # ==========================================================================
  # Administración (RF-02)
  # ==========================================================================
  /api/v1/admin/users:
    get:
      tags: [administración]
      operationId: listUsers
      x-estado: planificado
      summary: Listar usuarios
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [admin, teacher, student] } }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended, deleted] } }
        - { name: q, in: query, description: Búsqueda por nombre o correo, schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Página de usuarios
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [administración]
      operationId: createUser
      x-estado: planificado
      summary: Crear un profesor o administrador
      description: |
        La única vía para crear cuentas que no sean de estudiante (RF-01).
        Envía una invitación por correo; la cuenta nace sin contraseña.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name, role]
              properties:
                email: { type: string, format: email }
                full_name: { type: string, minLength: 1, maxLength: 120 }
                role: { type: string, enum: [admin, teacher] }
      responses:
        "201":
          description: Cuenta creada e invitación encolada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/Validacion" }

  /api/v1/admin/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [administración]
      operationId: getUser
      x-estado: planificado
      summary: Ver un usuario
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    patch:
      tags: [administración]
      operationId: updateUser
      x-estado: planificado
      summary: Cambiar el rol o el estado de un usuario
      description: |
        Responde `409 last_admin` al intentar suspender, eliminar o degradar al
        **último administrador activo**: el sistema no puede quedarse sin quien
        lo administre (RF-02). Toda transición queda auditada.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, teacher, student] }
                status: { type: string, enum: [active, suspended, deleted] }
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409":
          description: Se intentó dejar el sistema sin administrador activo
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "412": { $ref: "#/components/responses/PrecondicionFallida" }

  /api/v1/admin/users/{userId}/sessions:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [administración]
      operationId: listUserSessions
      x-estado: planificado
      summary: Sesiones abiertas de un usuario
      responses:
        "200":
          description: Sesiones
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "403": { $ref: "#/components/responses/Prohibido" }
    delete:
      tags: [administración]
      operationId: revokeAllUserSessions
      x-estado: planificado
      summary: Revocar todas las sesiones de un usuario
      description: |
        Efecto inmediato: la petición siguiente de ese usuario responde `401`,
        sin esperar a que la sesión expire. Es lo que el segmento 1 de la
        demostración tiene que evidenciar.
      responses:
        "204": { description: Sesiones revocadas }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/admin/audit:
    get:
      tags: [administración]
      operationId: listAuditEvents
      x-estado: planificado
      summary: Consultar el rastro de auditoría
      description: |
        El rastro es inmutable: PostgreSQL rechaza cualquier `UPDATE` o
        `DELETE` sobre él mediante un trigger (ADR-0003).
      parameters:
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Página de eventos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/admin/jobs:
    get:
      tags: [administración]
      operationId: listJobs
      x-estado: planificado
      summary: Estado de la cola, los reintentos y la DLQ
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, running, succeeded, failed, dead] } }
        - { name: type, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Página de trabajos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRunPage" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/admin/jobs/{jobId}/requeue:
    post:
      tags: [administración]
      operationId: requeueJob
      x-estado: planificado
      summary: Reencolar un trabajo desde la DLQ
      description: |
        Reencola **con la misma `job_key`** que tenía el trabajo original, que
        es exactamente lo que el segmento 4 de la demostración debe evidenciar.
        Gracias al reclamo atómico, si el trabajo ya se completó por otra vía,
        el reencolado no produce una segunda salida (ADR-0008).
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Trabajo reencolado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRun" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409":
          description: El trabajo no está en la DLQ
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ==========================================================================
  # Autoría (RF-03, RF-04)
  # ==========================================================================
  /api/v1/courses:
    get:
      tags: [autoría]
      operationId: listCourses
      summary: Listar los cursos de los que se es autor
      description: Un profesor ve los suyos; un administrador, todos.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, published, unpublished, archived] } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Página de cursos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoursePage" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [autoría]
      operationId: createCourse
      summary: Crear un curso
      description: Crea el curso y su versión 1 en estado `draft`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseInput" }
      responses:
        "201":
          description: Curso creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/Validacion" }

  /api/v1/courses/{courseId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [autoría]
      operationId: getCourse
      summary: Ver un curso
      responses:
        "200":
          description: Curso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    patch:
      tags: [autoría]
      operationId: updateCourse
      summary: Actualizar los metadatos del curso
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseInput" }
      responses:
        "200":
          description: Curso actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "412": { $ref: "#/components/responses/PrecondicionFallida" }
        "422": { $ref: "#/components/responses/Validacion" }
    delete:
      tags: [autoría]
      operationId: deleteCourse
      x-estado: planificado
      summary: Eliminar un curso
      description: Solo si nunca se publicó. Un curso con historia no se borra.
      responses:
        "204": { description: Curso eliminado }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409":
          description: El curso tuvo alguna versión publicada
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/courses/{courseId}/versions:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [autoría]
      operationId: listCourseVersions
      summary: Listar las versiones del curso
      responses:
        "200":
          description: Versiones
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CourseVersion" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [autoría]
      operationId: createCourseVersion
      summary: Crear una versión nueva a partir de la vigente
      description: |
        Clona la versión vigente a un borrador con `version_number + 1`,
        **conservando los `stable_id`** de módulos, unidades y recursos. Eso es
        lo que hace que el progreso de los estudiantes sobreviva a la
        publicación (ADR-0007).

        Los binarios no se duplican: los recursos de la versión nueva apuntan
        al mismo `asset_id`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Borrador creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseVersion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409":
          description: Ya existe un borrador abierto para este curso
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/courses/{courseId}/versions/{versionNumber}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/VersionNumber"
    get:
      tags: [autoría]
      operationId: getCourseVersion
      summary: Árbol completo de una versión
      responses:
        "200":
          description: Curso, módulos, unidades y recursos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseVersionTree" }
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /api/v1/courses/{courseId}/versions/{versionNumber}/preview:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/VersionNumber"
    get:
      tags: [autoría]
      operationId: previewCourseVersion
      summary: Previsualizar la versión como la vería un estudiante
      description: |
        Devuelve el árbol con `content_html` ya renderizado desde el Markdown
        canónico y **sanitizado** con lista blanca (ADR-0014). El HTML crudo se
        descarta en el parseo, no en la sanitización: dos barreras contra XSS.
      responses:
        "200":
          description: Previsualización
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseVersionTree" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/courses/{courseId}/versions/{versionNumber}/validate:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/VersionNumber"
    post:
      tags: [autoría]
      operationId: validateCourseVersion
      summary: Comprobar si la versión se puede publicar, sin publicarla
      description: |
        Mismas reglas que `/publish`, pero sin efecto. Devuelve `200` con la
        lista de incumplimientos, vacía si todo está en orden.
      responses:
        "200":
          description: Resultado de la validación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicationCheck" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/courses/{courseId}/versions/{versionNumber}/publish:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/VersionNumber"
    post:
      tags: [autoría]
      operationId: publishCourseVersion
      summary: Publicar la versión
      description: |
        **No falla al primer error**: recorre todas las reglas y devuelve la
        lista completa de incumplimientos en un solo `422` (CA-01).

        Reglas comprobadas: metadatos completos, estructura mínima
        curso → módulo → unidad → recurso visible, ningún recurso visible fuera
        de estado `ready`, criterios de aprobación definidos, todo quiz con al
        menos una pregunta y cada pregunta con al menos una opción correcta, y
        todo iframe apuntando a un dominio de la lista blanca.

        Al publicar, la versión pasa a ser **inmutable**: un trigger de
        PostgreSQL rechaza cualquier modificación de su árbol (ADR-0007).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Versión publicada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseVersion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "422":
          description: |
            La versión no cumple los requisitos. `errors` trae **todos** los
            incumplimientos, no el primero.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/courses/{courseId}/versions/{versionNumber}/unpublish:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/VersionNumber"
    post:
      tags: [autoría]
      operationId: unpublishCourseVersion
      summary: Despublicar la versión para poder editarla
      description: |
        En la Entrega 1, editar un curso publicado exige despublicarlo, como
        permite el §5.1 del enunciado.

        `unpublished` bloquea inscripciones nuevas, pero **conserva las
        existentes y su progreso**.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Versión despublicada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseVersion" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/Conflicto" }

