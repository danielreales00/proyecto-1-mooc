  /api/v1/resources/{resourceId}/content:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    patch:
      tags: [autoría]
      operationId: saveResourceContent
      summary: Guardar el contenido del recurso (autosave)
      description: |
        El servidor **no guarda lo que recibe**: parsea el Markdown, lo valida
        contra el subconjunto del MVP y lo vuelve a serializar en su forma
        canónica (ADR-0014). Guardar dos veces lo mismo produce byte a byte lo
        mismo, y por eso el `ETag` es estable y el autosave no genera revisiones
        falsas.

        `If-Match` es obligatorio: si el `ETag` no coincide, responde `412` con
        el contenido del servidor para que el editor resuelva el conflicto.

        Las referencias a binarios se escriben como `asset://{asset_id}`, nunca
        como URL firmada: las firmas caducan.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_md]
              properties:
                content_md: { type: string }
      responses:
        "200":
          description: Contenido guardado, ya normalizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceContent" }
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "409": { $ref: "#/components/responses/VersionInmutable" }
        "412": { $ref: "#/components/responses/PrecondicionFallida" }
        "422":
          description: El Markdown usa sintaxis fuera del subconjunto del MVP
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /api/v1/resources/{resourceId}/revisions:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [autoría]
      operationId: listResourceRevisions
      x-estado: planificado
      summary: Últimas 20 revisiones del contenido
      description: Es la recuperación que exige RF-04 y la base del historial de RO-03.
      responses:
        "200":
          description: Revisiones, de la más reciente a la más antigua
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
