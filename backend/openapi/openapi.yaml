        "403": { $ref: "#/components/responses/Prohibido" }

  /api/v1/resources/{resourceId}/revisions/{revisionId}/restore:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - { name: revisionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [autoría]
      operationId: restoreResourceRevision
