# Instancia del grupo de workers (ADR-0019, D2): consumidores de la cola
# compartida. Sin IP pública; sale a Internet por Cloud NAT. La cola no vive
# aquí: está en su propia máquina, que el autoscaler no puede retirar.
#
# Los servicios son los de docker-compose.yml con imágenes de Artifact Registry
# y la base en Cloud SQL. No usa `extends`: la instancia no tiene el
# repositorio, solo recibe este archivo por los metadatos de la plantilla.
#
# La concurrencia por instancia es la de la Entrega 2. Lo que crece con la
# demanda es el número de instancias, no los procesos dentro de cada una.

name: mooc

services:
  worker:
    image: ${REGISTRO}/worker:${VERSION}
    env_file: [.env]
    environment:
      WORKER_QUEUES: critical=6,default=3
    # /healthz para la autorreparación del grupo, que llega desde los rangos de
    # verificación de Google (el firewall no deja entrar nada más). /metrics,
    # en el mismo puerto, lo lee el agente de operaciones.
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Correos e insignias duran segundos: un minuto basta para terminarlos al
    # retirar la instancia.
    stop_grace_period: 60s
    restart: unless-stopped

  # Firmas incluidas en la imagen y freshclam apagado, igual que en local: el
  # mismo tag da el mismo veredicto en todas partes y la medición no depende
  # de una descarga (ADR-0011).
  clamav:
    image: clamav/clamav:1.4
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    volumes:
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # Concurrencia 1: con 2 vCPU, un segundo FFmpeg solo le quitaría CPU al
  # primero. Es un valor fijo que se registra en cada corrida de carga.
  worker-media:
    image: ${REGISTRO}/worker-media:${VERSION}
    env_file: [.env]
    environment:
      WORKER_QUEUES: bulk=1
      WORKER_CONCURRENCY: 1
    ports:
      - "127.0.0.1:8082:8081"
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # La transcodificación más larga de la Entrega 2 duró 196 s. Al retirar la
    # instancia, el trabajo en curso tiene este margen para terminar
    # (ADR-0019, D6); el ShutdownTimeout de asynq va por debajo de él.
    stop_grace_period: 300s
    restart: unless-stopped
