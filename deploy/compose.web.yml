# Instancia del grupo de API (ADR-0019, D2): Caddy, API, frontend y
# documentación. No tiene IP pública: el tráfico llega del balanceador por el
# puerto 80 y el TLS termina allí.
#
# Los servicios son los de docker-compose.yml, con tres diferencias: las
# imágenes vienen de Artifact Registry con el SHA del commit (no se construye
# en una máquina de 2 GiB), la base es Cloud SQL y Redis vive en la máquina de
# la cola. No usa `extends`: la instancia no tiene el repositorio, solo recibe
# este archivo por los metadatos de la plantilla.
#
# ${REGISTRO}, ${VERSION} e ${INSTANCIA} salen del .env que escribe el script
# de arranque, el mismo que lee la aplicación.

name: mooc

services:
  # Aplica las migraciones pendientes contra Cloud SQL y termina. Es idempotente
  # (ADR-0003), y cuando arrancan varias instancias a la vez un bloqueo
  # consultivo las serializa: solo una aplica, las demás esperan y no hacen nada.
  migrate:
    image: ${REGISTRO}/migrate:${VERSION}
    env_file: [.env]
    restart: "no"

  api:
    image: ${REGISTRO}/api:${VERSION}
    env_file: [.env]
    # Solo en el 127.0.0.1 de la máquina: lo lee el agente de operaciones para
    # llevar /metrics a Cloud Monitoring. La entrada es el proxy.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:v5.29.0
    environment:
      SWAGGER_JSON_URL: /openapi.yaml
      BASE_URL: /docs
      PERSIST_AUTHORIZATION: "true"
      DISPLAY_REQUEST_DURATION: "true"
      DOC_EXPANSION: none
    restart: unless-stopped

  frontend:
    image: ${REGISTRO}/frontend:${VERSION}
    restart: unless-stopped

  # Entrada HTTP desde el balanceador. Sin certificados: el TLS termina en el
  # balanceador. INSTANCIA es el nombre de la máquina, que Caddy devuelve en
  # cada respuesta para demostrar el reparto.
  proxy:
    image: caddy:2.10-alpine
    environment:
      INSTANCIA: ${INSTANCIA}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
      swagger:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped
