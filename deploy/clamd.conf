# Configuración de clamd para el entorno local (ADR-0011).
#
# La imagen trae la base de firmas dentro, así que arranca sin red y siempre con
# las mismas firmas: la misma etiqueta de imagen da el mismo veredicto. A cambio,
# las firmas son tan viejas como la etiqueta. En producción eso se invierte y
# freshclam se deja activo.

# El socket local no es opcional aunque el worker hable por TCP: el arranque de
# la imagen espera a que aparezca para dar el servicio por levantado, y
# clamdcheck.sh —el healthcheck— también lo usa.
LocalSocket /tmp/clamd.sock
# Sin TCPAddr a propósito: así clamd escucha en todas las interfaces, incluida
# la loopback IPv6 que usa el healthcheck de la imagen (`nc localhost 3310`).
TCPSocket 3310
Foreground yes
LogTime yes
LogFile /var/log/clamav/clamd.log

# El worker transmite el archivo por INSTREAM. El límite por defecto son 25 MB,
# que deja fuera cualquier vídeo real; 512 MB cubre el material del curso sin
# que clamd reserve memoria de más.
StreamMaxLength 512M
MaxFileSize 512M
MaxScanSize 512M

# Un archivo mayor que el límite NO se deja pasar: el worker lo manda a
# cuarentena con el motivo. Ver media/scan.go.
