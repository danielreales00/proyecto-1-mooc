$kind: http-request
url: "{{base_url}}/api/v1/auth/verify-email"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "token": "{{verify_token}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('verificado', () => pm.expect(pm.response.json().verified).to.be.true);
    language: text/javascript
order: 5000
