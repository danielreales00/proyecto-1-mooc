$kind: http-request
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{nuevo_email}}",
      "password": "{{demo_password}}",
      "full_name": "Otro"
    }
scripts:
  - type: afterResponse
    code: pm.test('409 conflict', () => pm.response.to.have.status(409));
    language: text/javascript
order: 11000
