$kind: http-request
description: Un token de un solo uso no se puede consumir dos veces.
url: "{{base_url}}/api/v1/auth/verify-email"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "token": "{{verify_token}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('422 al reutilizarlo', () => pm.response.to.have.status(422));
    language: text/javascript
order: 6000
