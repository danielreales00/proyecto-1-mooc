$kind: http-request
name: Heartbeat espaciado (esperar >10 s)
description: Ejecutar esta petición dos veces con más de 10 s entre medias para acumular permanencia.
url: "{{base_url}}/api/v1/enrollments/{{enrollment_id}}/progress"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{session_token}}
  Idempotency-Key: "{{idem_key}}"
body:
  type: text
  content: |-
    {
      "resource_stable_id": "{{text_stable_id}}",
      "kind": "heartbeat"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('idem_key', 'pm-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    language: text/javascript
  - type: afterResponse
    code: |-
      const d = pm.response.json();
      pm.test('202', () => pm.response.to.have.status(202));
      console.log('aceptada:', d.accepted, '· motivo:', d.reject_reason, '· pct:', d.progress_pct);
    language: text/javascript
order: 4000
