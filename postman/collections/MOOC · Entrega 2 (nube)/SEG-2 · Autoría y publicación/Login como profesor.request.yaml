$kind: http-request
description: Guarda el token en `prof_token` para las peticiones siguientes.
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "profesor@mooc.local",
      "password": "{{demo_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('prof_token', pm.response.json().token);
    language: text/javascript
order: 1000
