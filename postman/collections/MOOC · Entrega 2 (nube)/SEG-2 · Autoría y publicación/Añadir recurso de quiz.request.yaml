$kind: http-request
url: "{{base_url}}/api/v1/units/{{unit_id}}/resources"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{prof_token}}
body:
  type: text
  content: |-
    {
      "title": "Evaluación final",
      "type": "quiz"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201', () => pm.response.to.have.status(201));
      const d = pm.response.json();
      pm.collectionVariables.set('quiz_resource_id', d.id);
      pm.collectionVariables.set('quiz_stable_id', d.stable_id);
    language: text/javascript
order: 7000
