$kind: http-request
description: "El bucket de insignias tiene lectura anónima (ADR-0005). La URL no se firma a propósito: una insignia que caduca a los quince minutos no sirve para acreditar nada."
url: "{{badge_image_url}}"
method: GET
headers:
  Accept: image/svg+xml
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 sin cabecera de autorización', () => pm.response.to.have.status(200));
      pm.test('es una imagen SVG', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('image/svg+xml');
      });
      const svg = pm.response.text();
      pm.test('lleva el nombre y el código de verificación', () => {
        pm.expect(svg).to.include(pm.collectionVariables.get('badge_code'));
      });
      pm.test('CA-07: tampoco la imagen expone el correo', () => {
        pm.expect(svg).to.not.include('@');
      });
      console.log('La imagen es pública y no lleva el correo del estudiante.');
    language: text/javascript
order: 3000
