$kind: http-request
description: |-
  La API **no recibe los bytes**: crea el asset, abre la carga multipart y devuelve una URL prefirmada por parte. El cliente sube directamente al almacén (enunciado §4).

  El `sha256` que se declara aquí es una promesa; el servidor lo recalculará leyendo del bucket.
url: "{{base_url}}/api/v1/assets/init"
method: POST
headers:
  Idempotency-Key: "{{idem_key}}"
  Content-Type: application/json
  Authorization: Bearer {{prof_token}}
body:
  type: text
  content: "{\r

    \  \"filename\": \"archivo-de-prueba.mp4\",\r

    \  \"content_type\": \"video/mp4\",\r

    \  \"size_bytes\": 101541,\r

    \  \"sha256\": \"0d4245fc56d42398c2856fb960075fbf6f95afa58b10d44787e037d0ff8c2321\",\r

    \  \"kind\": \"video\"\r

    }"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('idem_key', 'pm-' + Date.now() + '-' + Math.random().toString(36).slice(2));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('201', () => pm.response.to.have.status(201));
      const d = pm.response.json();
      pm.collectionVariables.set('asset_id', d.asset_id);
      pm.collectionVariables.set('parte_1_url', d.parts[0].url);
      pm.test('una sola parte para este archivo', () => pm.expect(d.total_parts).to.eql(1));
      pm.test('la URL viene prefirmada', () =>
        pm.expect(d.parts[0].url).to.match(/X-(Amz|Goog)-Signature/));
      console.log('parte 1 →', d.parts[0].url.split('?')[0]);
    language: text/javascript
order: 2000
