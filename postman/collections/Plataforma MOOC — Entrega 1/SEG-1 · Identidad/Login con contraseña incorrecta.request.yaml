$kind: http-request
description: "Mismo 401 para usuario inexistente, contraseña incorrecta y cuenta sin verificar: no se revela qué correos existen."
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{nuevo_email}}",
      "password": "incorrecta"
    }
scripts:
  - type: afterResponse
    code: pm.test('401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 7000
