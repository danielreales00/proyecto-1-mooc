$kind: http-request
url: "{{base_url}}/api/v1/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "profesor@mooc.local",
      "password": "{{demo_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200: el profesor entra sin problema', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('prof_token', pm.response.json().token);
    language: text/javascript
order: 12000
